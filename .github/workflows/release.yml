name: Release

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options: [next, latest]
      confirmation:
        description: Type PUBLISH to release the package
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run release:check
      - run: echo "PACKAGE_FILE=$(npm pack --silent)" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "${{ env.PACKAGE_FILE }}"
      - run: npm publish "$PACKAGE_FILE" --provenance --access public --tag "${{ inputs.npm_tag }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(node -p "require('./package.json').version")" "$PACKAGE_FILE" --generate-notes --verify-tag=false
